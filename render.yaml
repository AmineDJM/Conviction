# Render Blueprint — Conviction
#
# One web service + one persistent disk. The only value you must provide is
# OPENAI_API_KEY (Render asks for it when you create the Blueprint).
# Everything else is set here or generated by Render.
#
# Why a disk (and not Supabase): the database (SQLite) and uploaded decks live
# on the disk, so no external database is needed. Render disks require a paid
# instance type (Starter or above) and a single instance.
services:
  - type: web
    name: conviction
    runtime: node
    plan: starter
    region: frankfurt
    numInstances: 1
    # NODE_ENV=production would make npm skip the devDependencies the build needs.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: conviction-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Encrypts uploaded documents at rest (AES-256-GCM) and off-site backups.
      # Generated once by Render; keep it (losing it makes stored documents unreadable).
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/conviction.db
      - key: STORAGE_DIR
        value: /var/data/uploads
      - key: CONVICTION_MODEL
        value: gpt-5.6-luna
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Backups: daily + before migrations, written to /var/data/backups (BACKUP_DIR
      # defaults to <dirname(DATABASE_PATH)>/backups). Optional off-site copies and
      # object storage for documents: add S3_BUCKET, S3_ACCESS_KEY_ID,
      # S3_SECRET_ACCESS_KEY (+ S3_ENDPOINT, S3_REGION) in the dashboard — see README
      # "Operations". Nothing here needs to be filled in.
